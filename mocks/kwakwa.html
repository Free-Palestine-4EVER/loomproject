<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root{
    --cream:#f8efe0;
    --cream-2:#fffaf1;
    --yellow:#f3c24b;
    --yellow-dark:#dfa72f;
    --brown:#4a3b2a;
    --brown-soft:#9c8b73;
    --brown-faint:#b9ab92;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:540px; height:1174px; overflow:hidden; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background:var(--cream);
    position:relative;
    color:var(--brown);
  }

  /* ---------- scene ---------- */
  .scene{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 50% at 50% 0%, #fffaf0 0%, rgba(255,250,240,0) 60%),
      linear-gradient(180deg,
        #f8efe0 0%,
        #f6e8c9 30%,
        #f1dda9 50%,
        #e4c583 63%,
        #d3af6c 64%,
        #c8a563 72%,
        #bd9a58 86%,
        #b18e4e 100%
      );
  }
  .horizon-line{
    position:absolute; left:50%; top:740px; transform:translate(-50%,-50%);
    width:360px; height:6px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,250,232,0.75) 0%, rgba(255,250,232,0) 75%);
  }
  .water-sheen{
    position:absolute; left:0; right:0; top:740px; height:120px;
    background:linear-gradient(180deg, rgba(255,251,238,0.30) 0%, rgba(255,251,238,0) 100%);
  }
  .reflection{
    position:absolute; left:50%; top:740px;
    transform:translateX(-50%) scaleY(-1);
    opacity:0.30; filter:blur(2px);
    z-index:6;
  }
  .reflection-fade{
    position:absolute; left:0; right:0; top:740px; height:220px; z-index:7;
    background:linear-gradient(180deg, rgba(228,197,131,0) 0%, #c8a563 55%, #b18e4e 100%);
  }
  .ripple{
    position:absolute; left:50%; top:748px; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(110,80,30,0.16);
    z-index:8;
  }
  .water-glint{
    position:absolute; border-radius:50%; background:rgba(255,250,230,0.35); filter:blur(1px);
    z-index:6;
  }

  /* ---------- status bar ---------- */
  .status-bar{
    position:absolute; top:0; left:0; right:0; height:54px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; z-index:20;
  }
  .status-bar .time{ font-size:17px; font-weight:600; letter-spacing:0.2px; color:var(--brown); }
  .island{
    position:absolute; left:50%; top:11px; transform:translateX(-50%);
    width:124px; height:34px; border-radius:20px; background:#0b0b0c;
  }
  .status-icons{ display:flex; align-items:center; gap:6px; }

  /* ---------- pair header ---------- */
  .pair-header{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:rgba(255,251,240,0.75);
    border:1px solid rgba(255,255,255,0.6);
    padding:8px 18px 8px 8px; border-radius:30px;
    box-shadow:0 6px 18px rgba(150,120,70,0.10);
    z-index:15;
  }
  .avatar-pair{ display:flex; }
  .avatar{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#fff;
    border:2px solid var(--cream-2);
  }
  .avatar.z{ background:linear-gradient(160deg,#f3c24b,#d99a2b); }
  .avatar.l{ background:linear-gradient(160deg,#e8917a,#c96a52); margin-left:-10px; }
  .pair-names{ font-size:14.5px; font-weight:700; color:var(--brown); }
  .pair-names span{ font-weight:500; color:var(--brown-soft); }

  /* ---------- floating status card ---------- */
  .status-card{
    position:absolute; top:158px; left:50%; transform:translateX(-50%);
    width:392px;
    background:var(--cream-2);
    border-radius:24px;
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 14px 30px rgba(150,120,70,0.14);
    z-index:15;
  }
  .status-card .dot-wrap{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(160deg,#fbe3a8,#f3c24b);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    flex-shrink:0;
  }
  .status-card .dot-wrap .pulse{
    position:absolute; top:-2px; right:-2px;
    width:13px; height:13px; border-radius:50%;
    background:#5bc46a; border:2.5px solid var(--cream-2);
  }
  .status-card .txt-1{ font-size:15px; font-weight:700; color:var(--brown); }
  .status-card .txt-2{ font-size:12.5px; color:var(--brown-soft); margin-top:2px; }

  /* ---------- today strip ---------- */
  .today-label{
    position:absolute; top:276px; left:34px; z-index:15;
    font-size:12.5px; font-weight:700; color:var(--brown-soft);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .today-strip{
    position:absolute; top:304px; left:34px; right:34px; z-index:15;
    display:flex; flex-direction:column; gap:10px;
  }
  .today-tile{
    background:var(--cream-2); border-radius:18px; padding:12px 16px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 6px 16px rgba(150,120,70,0.08);
  }
  .today-tile .icon{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .today-tile .txt{ font-size:13.5px; font-weight:600; color:var(--brown); }
  .today-tile .time{ font-size:11.5px; color:var(--brown-faint); margin-left:auto; flex-shrink:0; }

  /* ---------- duck ---------- */
  .duck-dock{
    position:absolute; left:50%; top:645px; transform:translate(-50%,-50%);
    z-index:10;
  }

  /* ---------- tab bar ---------- */
  .tab-bar{
    position:absolute; left:0; right:0; bottom:0; height:104px;
    background:rgba(255,251,240,0.92);
    border-top:1px solid rgba(150,120,70,0.10);
    display:flex; align-items:flex-start; padding-top:10px;
    z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:var(--brown-faint);
  }
  .tab.active{ color:var(--yellow-dark); }
  .tab .lbl{ font-size:10.5px; font-weight:600; }
  .tab.quack{ position:relative; top:-22px; color:var(--brown); }
  .quack-btn{
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(160deg,#f6cf6f,#e0a72e);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 20px rgba(224,167,46,0.45), 0 0 0 6px var(--cream);
    margin-bottom:2px;
  }
  .home-indicator{
    position:absolute; left:50%; bottom:9px; transform:translateX(-50%);
    width:134px; height:5px; border-radius:3px; background:rgba(74,59,42,0.55);
    z-index:30;
  }
</style>
</head>
<body>

  <div class="scene">
    <div class="horizon-line"></div>
    <div class="water-sheen"></div>

    <!-- reflection of the duck, mirrored under the waterline -->
    <div class="reflection">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <ellipse cx="112" cy="152" rx="66" ry="52" fill="#eeae3a"/>
        <ellipse cx="150" cy="145" rx="22" ry="32" fill="#d8931f" transform="rotate(-12 150 145)"/>
        <circle cx="90" cy="92" r="46" fill="#f2bb45"/>
        <path d="M46 88 Q18 84 16 96 Q18 108 46 104 Z" fill="#f28c2e"/>
      </svg>
    </div>
    <div class="reflection-fade"></div>

    <!-- ripples on the water, perspective-squashed under the duck -->
    <div class="ripple" style="width:190px;height:46px;"></div>
    <div class="ripple" style="width:280px;height:66px;border-color:rgba(110,80,30,0.12);"></div>
    <div class="ripple" style="width:380px;height:88px;border-color:rgba(110,80,30,0.08);"></div>
  </div>

  <!-- today in the pond -->
  <div class="today-label">Today in the pond</div>
  <div class="today-strip">
    <div class="today-tile">
      <div class="icon" style="background:linear-gradient(160deg,#fbe3a8,#f3c24b);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 a5 5 0 0 1 5 5 v5 a5 5 0 0 1 -10 0 V7 a5 5 0 0 1 5 -5 Z" fill="#4a3308"/><path d="M7 11 a5 5 0 0 0 10 0" stroke="#4a3308" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </div>
      <div class="txt">Lubna sent a quack</div>
      <div class="time">9:12 AM</div>
    </div>
    <div class="today-tile">
      <div class="icon" style="background:linear-gradient(160deg,#e8917a,#c96a52);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="14" rx="3" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="13" r="3.4" stroke="#fff" stroke-width="1.8"/><path d="M8 6 L9.5 3.5 h5 L16 6" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt">New photo added to Us</div>
      <div class="time">11:40 AM</div>
    </div>
    <div class="today-tile">
      <div class="icon" style="background:linear-gradient(160deg,#9dd6c4,#5aa98e);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="17" r="3" stroke="#fff" stroke-width="1.8"/><circle cx="17" cy="15" r="3" stroke="#fff" stroke-width="1.8"/><path d="M10 17 V6 l10 -2 v11" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>
      <div class="txt">Playlist: 2 new songs</div>
      <div class="time">1:15 PM</div>
    </div>
  </div>

  <!-- status bar -->
  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="status-icons">
      <svg width="18" height="13" viewBox="0 0 18 13" fill="none">
        <path d="M9 12.2C9.7 12.2 10.3 11.6 10.3 10.9C10.3 10.2 9.7 9.6 9 9.6C8.3 9.6 7.7 10.2 7.7 10.9C7.7 11.6 8.3 12.2 9 12.2Z" fill="#0b0b0c"/>
        <path d="M9 7.5C10.5 7.5 11.9 8.05 13 9.05L14.1 7.8C12.7 6.55 10.9 5.8 9 5.8C7.1 5.8 5.3 6.55 3.9 7.8L5 9.05C6.1 8.05 7.5 7.5 9 7.5Z" fill="#0b0b0c"/>
        <path d="M9 3C11.6 3 14 4 15.9 5.75L17 4.5C14.75 2.4 12 1.2 9 1.2C6 1.2 3.25 2.4 1 4.5L2.1 5.75C4 4 6.4 3 9 3Z" fill="#0b0b0c"/>
      </svg>
      <svg width="25" height="13" viewBox="0 0 25 13" fill="none">
        <rect x="1" y="1" width="20" height="11" rx="3" stroke="#0b0b0c" stroke-opacity="0.4" stroke-width="1"/>
        <rect x="2.5" y="2.5" width="16" height="8" rx="1.8" fill="#0b0b0c"/>
        <rect x="22.5" y="4" width="1.6" height="5" rx="0.8" fill="#0b0b0c" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>
  <div class="island"></div>

  <!-- pair header -->
  <div class="pair-header">
    <div class="avatar-pair">
      <div class="avatar z">Z</div>
      <div class="avatar l">L</div>
    </div>
    <div class="pair-names">Zeid &amp; Lubna <span>· 214 days</span></div>
  </div>

  <!-- floating status card -->
  <div class="status-card">
    <div class="dot-wrap">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="9" fill="#c96a52"/>
        <text x="11" y="15" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system">L</text>
      </svg>
      <div class="pulse"></div>
    </div>
    <div>
      <div class="txt-1">Lubna is nearby 💛</div>
      <div class="txt-2">2 min ago</div>
    </div>
  </div>

  <!-- duck on the pond -->
  <div class="duck-dock">
    <svg width="220" height="220" viewBox="0 0 220 220">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8d772"/>
          <stop offset="100%" stop-color="#eeae3a"/>
        </linearGradient>
        <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fbe08c"/>
          <stop offset="100%" stop-color="#f2bb45"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#eba934"/>
          <stop offset="100%" stop-color="#d8931f"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffb15c"/>
          <stop offset="100%" stop-color="#f28c2e"/>
        </linearGradient>
      </defs>

      <!-- tail feather -->
      <ellipse cx="160" cy="150" rx="16" ry="11" fill="url(#wingGrad)" transform="rotate(20 160 150)"/>

      <!-- body -->
      <ellipse cx="112" cy="152" rx="66" ry="52" fill="url(#bodyGrad)"/>
      <!-- belly highlight -->
      <ellipse cx="106" cy="168" rx="38" ry="26" fill="#fff3d0" opacity="0.55"/>
      <!-- wing -->
      <ellipse cx="150" cy="145" rx="22" ry="32" fill="url(#wingGrad)" transform="rotate(-12 150 145)"/>

      <!-- feet -->
      <path d="M92 200 q-4 10 -14 12 q10 3 18 -3 q4 8 14 8 q-6 -8 -4 -16z" fill="#f28c2e"/>
      <path d="M126 200 q-4 10 -14 12 q10 3 18 -3 q4 8 14 8 q-6 -8 -4 -16z" fill="#e97e1f"/>

      <!-- head -->
      <circle cx="90" cy="92" r="46" fill="url(#headGrad)"/>
      <!-- cheek blush -->
      <circle cx="65" cy="104" r="10" fill="#f4a389" opacity="0.45"/>
      <!-- beak -->
      <path d="M46 88 Q18 84 16 96 Q18 108 46 104 Z" fill="url(#beakGrad)"/>
      <path d="M20 94 Q30 98 44 96" stroke="#d9701a" stroke-width="1.6" fill="none" opacity="0.6"/>
      <!-- eye -->
      <circle cx="70" cy="82" r="6.5" fill="#3a2c1c"/>
      <circle cx="72.5" cy="79" r="2.1" fill="#fff"/>
      <!-- head highlight -->
      <ellipse cx="102" cy="72" rx="16" ry="11" fill="#fff3d0" opacity="0.5"/>
    </svg>
  </div>

  <!-- tab bar -->
  <div class="tab-bar">
    <div class="tab active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12 L12 5 L20 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11 V19 H18 V11" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div class="lbl">Pond</div>
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6 h16 v10 H10 l-4 4 v-4 H4 Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div class="lbl">Chat</div>
    </div>
    <div class="tab quack">
      <div class="quack-btn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2 a5 5 0 0 1 5 5 v5 a5 5 0 0 1 -10 0 V7 a5 5 0 0 1 5 -5 Z" fill="#4a3b2a"/><path d="M7 11 a5 5 0 0 0 10 0" stroke="#4a3b2a" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M12 18 v3" stroke="#4a3b2a" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="lbl">Quack</div>
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="7" cy="17" r="3" stroke="currentColor" stroke-width="2.2"/><circle cx="17" cy="15" r="3" stroke="currentColor" stroke-width="2.2"/><path d="M10 17 V6 l10 -2 v11" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <div class="lbl">Playlist</div>
    </div>
    <div class="tab">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20 C6 15.5 3 12 3 8.2 C3 5.4 5.2 3.4 7.8 3.4 C9.4 3.4 10.8 4.2 12 5.6 C13.2 4.2 14.6 3.4 16.2 3.4 C18.8 3.4 21 5.4 21 8.2 C21 12 18 15.5 12 20 Z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg>
      <div class="lbl">Us</div>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
