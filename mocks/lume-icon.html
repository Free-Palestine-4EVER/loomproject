<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 128px; height: 128px;
    overflow: hidden;
    background: transparent;
  }
  .tile {
    width: 128px; height: 128px;
    border-radius: 35.8px; /* 28% of 128 */
    overflow: hidden;
    position: relative;
    background: #0c0c0f;
  }
  .bloom-warm {
    position: absolute;
    left: -18px; top: -18px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,199,148,0.9) 0%, rgba(255,179,122,0.4) 40%, rgba(255,179,122,0) 72%);
    filter: blur(2px);
  }
  .bloom-cool {
    position: absolute;
    right: -22px; bottom: -22px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(126,166,255,0.75) 0%, rgba(126,166,255,0.3) 42%, rgba(126,166,255,0) 72%);
    filter: blur(2px);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
  }
  .mark-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 66px; height: 66px;
  }
  .ring-outer {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 200deg, #ffcf9e 0deg, #ffb37a 60deg, #1a1a1e 130deg, #1a1a1e 230deg, #7ea6ff 300deg, #a9c4ff 340deg, #ffcf9e 360deg);
    padding: 4px;
  }
  .ring-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: #0c0c0f;
  }
  .aperture {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      rgba(255,255,255,0.95) 0deg 40deg, rgba(255,255,255,0) 40deg 60deg,
      rgba(255,255,255,0.7) 60deg 100deg, rgba(255,255,255,0) 100deg 120deg,
      rgba(255,255,255,0.95) 120deg 160deg, rgba(255,255,255,0) 160deg 180deg,
      rgba(255,255,255,0.7) 180deg 220deg, rgba(255,255,255,0) 220deg 240deg,
      rgba(255,255,255,0.95) 240deg 280deg, rgba(255,255,255,0) 280deg 300deg,
      rgba(255,255,255,0.7) 300deg 340deg, rgba(255,255,255,0) 340deg 360deg);
    -webkit-mask-image: radial-gradient(circle, transparent 32%, #000 33%, #000 100%);
    mask-image: radial-gradient(circle, transparent 32%, #000 33%, #000 100%);
  }
  .core-dot {
    position: absolute; left: 50%; top: 50%;
    width: 10px; height: 10px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffb37a 70%);
    box-shadow: 0 0 8px rgba(255,179,122,0.9);
  }
</style>
</head>
<body>
  <div class="tile">
    <div class="bloom-warm"></div>
    <div class="bloom-cool"></div>
    <div class="vignette"></div>
    <div class="mark-wrap">
      <div class="ring-outer"><div class="ring-inner"></div></div>
      <div class="aperture"></div>
      <div class="core-dot"></div>
    </div>
  </div>
</body>
</html>
