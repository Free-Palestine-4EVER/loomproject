<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 540px;
    height: 1174px;
    background: #f4f3f1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
    color: #14161a;
    overflow: hidden;
    position: relative;
  }

  /* ---------- status bar ---------- */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    z-index: 50;
  }
  .statusbar .time {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    padding-top: 4px;
    color: #14161a;
  }
  .island {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px;
    height: 37px;
    background: #000;
    border-radius: 20px;
  }
  .statusbar .right {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 4px;
  }

  /* ---------- top app bar ---------- */
  .topbar {
    position: absolute;
    top: 72px;
    left: 0; right: 0;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 40;
  }
  .topbar .title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: #14161a;
  }
  .topbar .sub {
    font-size: 11px;
    color: rgba(20,22,26,0.42);
    font-weight: 500;
    margin-top: 1px;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 17px;
    background: rgba(20,22,26,0.06);
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- plan card ---------- */
  .card {
    position: absolute;
    top: 136px;
    left: 20px; right: 20px;
    height: 500px;
    background: #ffffff;
    border-radius: 26px;
    box-shadow: 0 1px 2px rgba(20,22,26,0.04), 0 12px 30px rgba(20,22,26,0.06);
    overflow: hidden;
  }
  .card-head {
    padding: 20px 22px 4px 22px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .card-head .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #7b2fbe;
  }
  .card-head .name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-top: 3px;
    color: #14161a;
  }
  .scale-chip {
    background: #f1f0ee;
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(20,22,26,0.55);
    margin-top: 2px;
  }

  .plan-wrap {
    position: absolute;
    top: 74px;
    left: 0; right: 0;
    bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- rooms breakdown card ---------- */
  .rooms-card {
    position: absolute;
    top: 652px;
    left: 20px; right: 20px;
    height: 250px;
    background: #ffffff;
    border-radius: 26px;
    box-shadow: 0 1px 2px rgba(20,22,26,0.04), 0 12px 30px rgba(20,22,26,0.06);
    padding: 18px 22px 8px 22px;
  }
  .rooms-card .rc-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: rgba(20,22,26,0.4);
    margin-bottom: 6px;
  }
  .room-row {
    display: flex;
    align-items: center;
    height: 62px;
    border-bottom: 1px solid rgba(20,22,26,0.07);
  }
  .room-row:last-child { border-bottom: none; }
  .room-row .dot {
    width: 11px; height: 11px;
    border-radius: 3px;
    margin-right: 13px;
    flex-shrink: 0;
  }
  .room-row .rname {
    flex: 1;
    font-size: 15.5px;
    font-weight: 600;
    color: #14161a;
  }
  .room-row .rarea {
    font-size: 15.5px;
    font-weight: 700;
    color: rgba(20,22,26,0.85);
    margin-right: 10px;
  }
  .room-row .chev { color: rgba(20,22,26,0.25); }

  /* ---------- bottom sticky summary + CTA ---------- */
  .bottom-panel {
    position: absolute;
    bottom: 64px;
    left: 20px; right: 20px;
    height: 190px;
  }

  /* room chips inside svg use HTML overlay for crisp text */
  .room-chip {
    position: absolute;
    text-align: center;
    pointer-events: none;
  }
  .room-chip .rn {
    font-size: 13.5px;
    font-weight: 700;
    color: #14161a;
    letter-spacing: -0.1px;
  }
  .room-chip .ra {
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(20,22,26,0.45);
    margin-top: 1px;
  }

  .dim-label {
    position: absolute;
    font-size: 11px;
    font-weight: 700;
    color: #7b2fbe;
    background: #ffffff;
    padding: 1px 5px;
    letter-spacing: 0.1px;
  }

  /* summary row */
  .summary {
    position: absolute;
    top: 0;
    left: 0; right: 0;
    height: 62px;
    background: linear-gradient(135deg, rgba(89,230,255,0.14), rgba(123,47,190,0.14));
    border: 1px solid rgba(123,47,190,0.16);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
  }
  .summary .tot-lbl {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: rgba(20,22,26,0.5);
  }
  .summary .tot-val {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: #14161a;
    margin-top: 1px;
  }
  .summary .rooms-count {
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(20,22,26,0.5);
    text-align: right;
  }
  .summary .rooms-count b { color: #14161a; font-weight: 700; }

  .send-btn {
    position: absolute;
    top: 76px;
    left: 0; right: 0;
    height: 54px;
    border-radius: 16px;
    background: linear-gradient(135deg, #59e6ff 0%, #7b2fbe 100%);
    color: #05070a;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 20px rgba(123,47,190,0.22);
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    background: rgba(20,22,26,0.5);
    z-index: 50;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="card-head">
      <div>
        <div class="label">Measured Plan</div>
        <div class="name">Apartment 12B</div>
      </div>
      <div class="scale-chip">1 : 60</div>
    </div>

    <div class="plan-wrap">
      <svg width="440" height="420" viewBox="0 0 440 420">
        <!-- coordinate: 1m = 34px -->
        <!-- Living: 5.6 x 4.0m -> 190 x 136 -->
        <!-- Kitchen: 3.5 x 2.6m -> 119 x 88 -->
        <!-- Hall: 2.3 x 2.0m -> 78 x 68 -->

        <!-- floor fills -->
        <rect x="40" y="40" width="190" height="176" fill="#f7f6f4" />
        <rect x="230" y="40" width="150" height="120" fill="#f2f1ee" />
        <rect x="230" y="160" width="150" height="56" fill="#eeecfa" />

        <!-- interior partition lines (thin) -->
        <line x1="230" y1="40" x2="230" y2="216" stroke="#c9c6c1" stroke-width="2" />
        <line x1="230" y1="160" x2="380" y2="160" stroke="#c9c6c1" stroke-width="2" />

        <!-- outer walls (thick strokes) -->
        <rect x="40" y="40" width="340" height="176" fill="none" stroke="#14161a" stroke-width="7" stroke-linejoin="round" />

        <!-- door swing: living -> kitchen -->
        <path d="M230,80 A38,38 0 0 1 268,118" fill="none" stroke="#b9b6b0" stroke-width="1.4" stroke-dasharray="3 3" />
        <line x1="230" y1="80" x2="230" y2="118" stroke="#ffffff" stroke-width="6" />
        <line x1="230" y1="80" x2="268" y2="118" stroke="#14161a" stroke-width="2.4" stroke-linecap="round" />

        <!-- door swing: kitchen -> hall -->
        <path d="M320,160 A26,26 0 0 1 346,186" fill="none" stroke="#b9b6b0" stroke-width="1.4" stroke-dasharray="3 3" />
        <line x1="320" y1="160" x2="320" y2="186" stroke="#ffffff" stroke-width="6" />
        <line x1="320" y1="160" x2="346" y2="186" stroke="#14161a" stroke-width="2.4" stroke-linecap="round" />

        <!-- front door on exterior wall (living, bottom edge) -->
        <path d="M90,216 A34,34 0 0 0 124,182" fill="none" stroke="#b9b6b0" stroke-width="1.4" stroke-dasharray="3 3" />
        <line x1="90" y1="216" x2="124" y2="216" stroke="#ffffff" stroke-width="6" />
        <line x1="90" y1="216" x2="124" y2="182" stroke="#14161a" stroke-width="2.4" stroke-linecap="round" />

        <!-- sofa in living -->
        <rect x="58" y="60" width="70" height="26" rx="6" fill="#e4e1db" stroke="#c9c6c1" stroke-width="1.4" />
        <rect x="132" y="150" width="46" height="30" rx="4" fill="#e4e1db" stroke="#c9c6c1" stroke-width="1.4" />

        <!-- kitchen counter -->
        <rect x="240" y="48" width="130" height="16" rx="3" fill="#e4e1db" stroke="#c9c6c1" stroke-width="1.4" />
        <rect x="356" y="70" width="16" height="80" rx="3" fill="#e4e1db" stroke="#c9c6c1" stroke-width="1.4" />

        <!-- N compass -->
        <g transform="translate(400,28)">
          <circle r="12" fill="#ffffff" stroke="#dedad4" stroke-width="1.4" />
          <path d="M0,-7 L3.4,4 L0,1.6 L-3.4,4 Z" fill="#7b2fbe" />
        </g>

        <!-- dimension line: left edge (height 4.0m + 2.6m stack visually = full 176px) -->
        <line x1="16" y1="40" x2="16" y2="216" stroke="#7b2fbe" stroke-width="1.4" />
        <line x1="11" y1="40" x2="21" y2="40" stroke="#7b2fbe" stroke-width="1.4" />
        <line x1="11" y1="216" x2="21" y2="216" stroke="#7b2fbe" stroke-width="1.4" />

        <!-- dimension line: bottom edge full width 10.0m -->
        <line x1="40" y1="238" x2="380" y2="238" stroke="#7b2fbe" stroke-width="1.4" />
        <line x1="40" y1="233" x2="40" y2="243" stroke="#7b2fbe" stroke-width="1.4" />
        <line x1="380" y1="233" x2="380" y2="243" stroke="#7b2fbe" stroke-width="1.4" />

        <!-- tick at partition on bottom dim -->
        <line x1="230" y1="233" x2="230" y2="243" stroke="#7b2fbe" stroke-width="1.4" />
      </svg>
    </div>

    <!-- room chip overlays positioned to match svg centers (svg is centered at plan-wrap, 440x420 box) -->
    <div class="room-chip" style="left:92px; top:236px;">
      <div class="rn">Living</div>
      <div class="ra">22.4 m²</div>
    </div>
    <div class="room-chip" style="left:335px; top:174px;">
      <div class="rn">Kitchen</div>
      <div class="ra">9.1 m²</div>
    </div>
    <div class="room-chip" style="left:335px; top:290px;">
      <div class="rn">Hall</div>
      <div class="ra">4.6 m²</div>
    </div>

    <div class="dim-label" style="left:34px; top:230px;">4.0 m</div>
    <div class="dim-label" style="left:196px; top:355px;">5.6 m</div>
  </div>

  <div class="rooms-card">
    <div class="rc-title">Detected Rooms</div>
    <div class="room-row">
      <div class="dot" style="background:#59e6ff;"></div>
      <div class="rname">Living</div>
      <div class="rarea">22.4 m²</div>
      <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="room-row">
      <div class="dot" style="background:#a071d6;"></div>
      <div class="rname">Kitchen</div>
      <div class="rarea">9.1 m²</div>
      <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="room-row">
      <div class="dot" style="background:#7b2fbe;"></div>
      <div class="rname">Hall</div>
      <div class="rarea">4.6 m²</div>
      <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="summary">
      <div>
        <div class="tot-lbl">Total Area</div>
        <div class="tot-val">36.1 m²</div>
      </div>
      <div class="rooms-count"><b>3</b> rooms<br/>2 doors detected</div>
    </div>

    <div class="send-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="#05070a"/></svg>
      Send to Evora
    </div>
  </div>

  <div class="topbar">
    <div class="icon-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#14161a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div style="text-align:center;">
      <div class="title">Floor Plan</div>
      <div class="sub">Measured &middot; Aug 11</div>
    </div>
    <div class="icon-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#14161a" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="statusbar">
    <div class="time">09:41</div>
    <div class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 9L1 11" stroke="#14161a" stroke-width="1.6" stroke-linecap="round"/><path d="M5 7L5 11" stroke="#14161a" stroke-width="1.6" stroke-linecap="round"/><path d="M9 5L9 11" stroke="#14161a" stroke-width="1.6" stroke-linecap="round"/><path d="M13 3L13 11" stroke="#14161a" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 5C4.5 1.5 11.5 1.5 15 5" stroke="#14161a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 8C6 6 10 6 12 8" stroke="#14161a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1" fill="#14161a"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="2.5" stroke="#14161a" stroke-opacity="0.5" stroke-width="1"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.3" fill="#33c25a"/><rect x="22" y="4" width="1.6" height="4" rx="0.8" fill="#14161a" fill-opacity="0.5"/></svg>
    </div>
  </div>
  <div class="island"></div>

  <div class="home-indicator"></div>

</body>
</html>
