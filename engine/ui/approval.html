<!doctype html>
<!-- engine/ui/approval.html — Approval (operator side): generate the client link, copy WhatsApp message, watch decisions land -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Approval — LOOM ENGINE</title>
<link rel="stylesheet" href="css/app.css" />
<style>
  .decision-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .decision-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<main>
  <h1>Approval</h1>
  <p class="page-sub">Generate the client's no-login review link, send it, then watch verdicts land here.</p>

  <div class="section panel">
    <h2>Generate link</h2>
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      <div>
        <label for="a-client">Client</label>
        <select id="a-client"></select>
      </div>
      <div>
        <label for="a-month">Month</label>
        <input id="a-month" type="month" />
      </div>
      <button id="a-go" class="primary">Generate link</button>
    </div>

    <div id="a-link-box" style="margin-top:16px;display:none;">
      <label>Approval URL</label>
      <div style="display:flex;gap:8px;">
        <input id="a-url" readonly style="flex:1;" />
        <button id="a-copy">Copy</button>
      </div>
      <label style="margin-top:12px;">WhatsApp-ready message</label>
      <textarea id="a-wa" readonly style="width:100%;min-height:80px;"></textarea>
      <div style="margin-top:8px;">
        <button id="a-copy-wa">Copy message</button>
        <a id="a-open-wa" class="btn" href="#" target="_blank" rel="noopener">Open in WhatsApp</a>
      </div>
    </div>
  </div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 style="margin:0;">Decisions</h2>
      <button id="a-refresh" class="ghost">Refresh</button>
    </div>
    <div id="a-decisions" class="empty-state">generate a link above to see decisions land here.</div>
  </div>
</main>

<script type="module" src="js/approval.mjs"></script>
</body>
</html>
