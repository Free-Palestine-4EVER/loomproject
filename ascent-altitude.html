<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ascent idea 02 — ALTITUDE</title>
<style>
  @font-face { font-family:'Bloom'; src:url('/fonts/loom-bloom/LOOMBloom-Regular.woff2') format('woff2'); font-display:swap }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#05060a;color:#f2f0f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .wrap{height:620vh}
  .pin{position:sticky;top:0;height:100vh;overflow:hidden}
  .sky{position:absolute;inset:0;transition:none}
  .layer{position:absolute;left:0;right:0;will-change:transform}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none;padding:clamp(24px,4vw,56px);display:flex;flex-direction:column;justify-content:space-between}
  .kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .kick b{color:#f21c8c;font-weight:400}
  .alt{font-family:'Bloom',sans-serif;font-size:clamp(46px,9vw,140px);line-height:.9;letter-spacing:.01em}
  .alt small{display:block;font-family:inherit;font-size:.18em;letter-spacing:.24em;opacity:.6;margin-top:10px}
  .stage{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:min(720px,86vw)}
  .stage h2{font-family:'Bloom',sans-serif;font-weight:400;font-size:clamp(38px,8vw,104px);line-height:.92}
  .stage p{margin-top:12px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}
  .band{position:absolute;right:clamp(24px,4vw,56px);top:50%;transform:translateY(-50%);display:grid;gap:12px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45);text-align:right}
  .band span.on{color:#fff}
  .back{position:fixed;left:16px;top:16px;z-index:5;font-size:12px;color:#a89fc0;text-decoration:none;border:1px solid rgba(242,240,247,.2);padding:8px 14px;border-radius:99px;background:rgba(5,6,10,.7)}
  .note{position:fixed;right:16px;bottom:16px;z-index:5;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<a class="back" href="/">← back to site</a>
<div class="note">idea 02 · altitude — keep scrolling, you are climbing</div>

<div class="wrap">
  <div class="pin">
    <div class="sky" id="sky"></div>
    <canvas id="stars"></canvas>
    <div class="layer" id="l3"></div>
    <div class="layer" id="l2"></div>
    <div class="layer" id="l1"></div>
    <canvas id="fx"></canvas>

    <div class="stage" id="stage"><h2 id="sh"></h2><p id="sp"></p></div>

    <div class="hud">
      <div>
        <p class="kick"><b>◆</b> The Ascent — idea 02</p>
        <div class="alt"><span id="m">0</span> M<small id="zone">GROUND</small></div>
      </div>
      <div></div>
    </div>
    <div class="band" id="band"></div>
  </div>
</div>

<script>
const ZONES = [
  { at:0.00, name:'GROUND',       sky:['#1b1026','#3a1c3f'], h:'REBRAND',  p:'We find what you actually stand for, then make it unmistakable.' },
  { at:0.26, name:'ROOFTOPS',     sky:['#3a1c3f','#7b2fbe'], h:'PRODUCE',  p:'Photography, film and 3D — generated at the volume your feed eats.' },
  { at:0.50, name:'CLOUD DECK',   sky:['#7b2fbe','#f21c8c'], h:'AUTOMATE', p:'AI agents that answer, book and sell while you sleep.' },
  { at:0.74, name:'STRATOSPHERE', sky:['#2a1150','#0b0a1e'], h:'ASCEND',   p:'Then we push. New markets, new formats, new altitude.' },
  { at:0.92, name:'ORBIT',        sky:['#05060a','#05060a'], h:'LOOM',     p:'Six territories, one climb. This is the whole company in one scroll.' },
]
const MAX_M = 84000

const sky=document.getElementById('sky')
const stars=document.getElementById('stars'), sctx=stars.getContext('2d')
const fx=document.getElementById('fx'), fctx=fx.getContext('2d')
let W=0,H=0,dpr=Math.min(devicePixelRatio||1,2)
function size(){
  W=innerWidth;H=innerHeight
  for(const cv of [stars,fx]){cv.width=W*dpr;cv.height=H*dpr}
  sctx.setTransform(dpr,0,0,dpr,0,0);fctx.setTransform(dpr,0,0,dpr,0,0)
}
addEventListener('resize',size);size()

let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647
const STARS=Array.from({length:170},()=>({x:rnd(),y:rnd(),r:rnd()*1.5+.3,a:rnd()}))
const CLOUDS=Array.from({length:22},()=>({x:rnd(),y:rnd(),s:rnd()*.7+.4,a:.06+rnd()*.12,v:rnd()}))

// city silhouette, drawn once as an SVG-ish path in the DOM layers
function buildings(n,h,color,op){
  let s='<svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block;opacity:'+op+'"><path fill="'+color+'" d="M0 300 '
  let x=0
  while(x<1000){ const w=18+rnd()*60, hh=60+rnd()*220; s+='L'+x+' '+(300-hh)+' L'+(x+w)+' '+(300-hh)+' '; x+=w+4 }
  s+='L1000 300 Z"/></svg>'
  return s
}
document.getElementById('l1').innerHTML=buildings(0,260,'#0a0512',1)
document.getElementById('l2').innerHTML=buildings(0,320,'#150a24',1)
document.getElementById('l3').innerHTML=buildings(0,380,'#1e0f31',1)

const band=document.getElementById('band')
band.innerHTML=ZONES.map(z=>'<span>'+z.name+'</span>').join('')

function lerp(a,b,t){return a+(b-a)*t}
function mix(c1,c2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]
  const A=p(c1),B=p(c2)
  return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'
}

function frame(){
  const wrap=document.querySelector('.wrap'), r=wrap.getBoundingClientRect()
  const total=wrap.offsetHeight-innerHeight
  const p=Math.min(1,Math.max(0,(-r.top)/total))

  // which zone we are in
  let zi=0; for(let i=0;i<ZONES.length;i++) if(p>=ZONES[i].at) zi=i
  const z=ZONES[zi], zn=ZONES[Math.min(ZONES.length-1,zi+1)]
  const local=(p-z.at)/Math.max(0.001,(zn.at-z.at))
  sky.style.background='linear-gradient(180deg,'+mix(z.sky[0],zn.sky[0],Math.min(1,local))+','+mix(z.sky[1],zn.sky[1],Math.min(1,local))+')'

  // parallax: the ground falls away at different rates
  document.getElementById('l1').style.transform='translateY('+(H*0.62 + p*H*3.2)+'px)'
  document.getElementById('l2').style.transform='translateY('+(H*0.60 + p*H*2.3)+'px)'
  document.getElementById('l3').style.transform='translateY('+(H*0.58 + p*H*1.7)+'px)'

  // stars fade in above the cloud deck
  sctx.clearRect(0,0,W,H)
  const starA=Math.max(0,(p-0.55)/0.35)
  if(starA>0){
    for(const s of STARS){
      sctx.globalAlpha=starA*(0.35+s.a*0.65)
      sctx.fillStyle='#fff'
      sctx.beginPath();sctx.arc(s.x*W,((s.y+p*0.25)%1)*H,s.r,0,7);sctx.fill()
    }
    sctx.globalAlpha=1
  }

  // clouds rush past around the cloud deck
  fctx.clearRect(0,0,W,H)
  const cloudA=Math.max(0,1-Math.abs(p-0.5)/0.32)
  if(cloudA>0.02){
    for(const cl of CLOUDS){
      const y=((cl.y - p*1.6 + cl.v*0.2)%1+1)%1
      fctx.globalAlpha=cl.a*cloudA
      fctx.fillStyle='#fff'
      fctx.beginPath()
      fctx.ellipse(cl.x*W,y*H,W*0.16*cl.s,H*0.045*cl.s,0,0,7)
      fctx.fill()
    }
    fctx.globalAlpha=1
  }

  // the earth's curve, once you are in orbit
  if(p>0.86){
    const a=(p-0.86)/0.14
    fctx.save()
    fctx.globalAlpha=Math.min(1,a)
    const R=W*1.5, cx=W/2, cy=H+R*0.72
    const g=fctx.createRadialGradient(cx,cy,R*0.94,cx,cy,R)
    g.addColorStop(0,'rgba(123,47,190,.55)');g.addColorStop(1,'rgba(89,230,255,0)')
    fctx.fillStyle=g
    fctx.beginPath();fctx.arc(cx,cy,R,0,7);fctx.fill()
    fctx.fillStyle='#120a1f'
    fctx.beginPath();fctx.arc(cx,cy,R*0.985,0,7);fctx.fill()
    fctx.restore()
  }

  document.getElementById('m').textContent=Math.round(p*MAX_M).toLocaleString()
  document.getElementById('zone').textContent=z.name
  document.getElementById('sh').textContent=z.h
  document.getElementById('sp').textContent=z.p
  ;[...band.children].forEach((el,i)=>el.classList.toggle('on',i===zi))

  requestAnimationFrame(frame)
}
frame()
</script>
</body>
</html>
