<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop All Lighting — Loomina</title>
<meta name="description" content="Eighty fixtures, hand-blown and hand-spun. Filter by room, finish or price and see every one lit.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23ffb34a'/></svg>">
<link rel="stylesheet" href="../css/loomina.css">
<style>
  .shop-head{ padding-block:clamp(28px,4vw,44px) 0; }
  .shop-layout{ display:grid; grid-template-columns:216px 1fr; gap:clamp(24px,3.4vw,56px); align-items:start; padding-block:24px clamp(60px,8vw,110px); }

  /* sidebar */
  .shop-side{ position:sticky; top:calc(var(--nav-h) + 22px); display:grid; gap:2px; align-content:start; }
  .shop-side-title{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:0 4px 10px; }
  .shop-side button{
    all:unset; box-sizing:border-box; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
    padding:11px 4px; font-size:14px; color:var(--ink-2); border-bottom:1px solid var(--hairline-2);
    transition:color .25s var(--e-out), border-color var(--t-light) var(--e-soft);
  }
  .shop-side button:hover{ color:var(--ink); }
  .shop-side button[aria-pressed="true"]{ color:var(--ink); font-weight:500; }
  .shop-side button .n{ color:var(--ink-3); font-variant-numeric:tabular-nums; font-weight:400; }

  @media (max-width:900px){
    .shop-layout{ grid-template-columns:1fr; }
    .shop-side{ position:static; display:flex; overflow-x:auto; gap:8px; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .shop-side::-webkit-scrollbar{ display:none; }
    .shop-side-title{ display:none; }
    .shop-side button{ all:unset; box-sizing:border-box; white-space:nowrap; flex:none; border:1px solid var(--hairline); border-radius:var(--pill); padding:8px 15px; font-size:13px; }
    .shop-side button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  }

  /* top bar */
  .shop-top{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-block:16px; border-bottom:1px solid var(--hairline-2); margin-bottom:24px; }
  .shop-count{ font-size:14px; color:var(--ink-2); white-space:nowrap; }
  .shop-search{
    height:36px; border-radius:var(--pill); border:1px solid var(--hairline); background:transparent; color:var(--ink);
    padding-inline:14px; font-size:13px; min-width:0; width:clamp(120px,18vw,220px);
    transition:border-color .25s var(--e-out);
  }
  .shop-search::placeholder{ color:var(--ink-3); }
  .shop-search:focus{ border-color:var(--ink-3); }
  select.shop-sort{
    height:36px; border-radius:var(--pill); border:1px solid var(--hairline); background:var(--surface); color:var(--ink);
    padding-inline:14px; font-size:13px; cursor:pointer; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
    background-position:calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px; background-repeat:no-repeat;
  }
  .shop-top{ position:relative; }
  .filter-dd{ position:relative; }
  .filter-dd > summary{
    list-style:none; cursor:pointer; height:36px; padding-inline:16px; border-radius:var(--pill); border:1px solid var(--hairline);
    display:inline-flex; align-items:center; font-size:13px; color:var(--ink-2); user-select:none;
    transition:border-color .25s var(--e-out), color .25s var(--e-out);
  }
  .filter-dd > summary::-webkit-details-marker{ display:none; }
  .filter-dd[open] > summary{ border-color:var(--ink-3); color:var(--ink); }
  .filter-dd .fp{
    position:absolute; top:calc(100% + 10px); left:0; z-index:50; width:min(320px,86vw);
    background:var(--surface); border:1px solid var(--hairline-2); border-radius:var(--r-md);
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.16); display:grid; gap:18px;
  }
  :root[data-lit="on"] .filter-dd .fp{ box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .fp label{ font-size:12px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase; }
  .fp-range{ display:flex; align-items:center; gap:10px; min-width:0; }
  .fp-range input[type="range"]{ flex:1; min-width:0; width:0; accent-color:var(--ink); }
  .fp-finishes{ display:flex; flex-wrap:wrap; gap:8px; }
  .viewsize{ display:flex; gap:3px; margin-left:auto; }
  .viewsize button{
    all:unset; box-sizing:border-box; width:30px; height:30px; display:grid; place-items:center; cursor:pointer;
    border-radius:8px; font-size:12px; color:var(--ink-3);
    transition:background .25s var(--e-out), color .25s var(--e-out);
  }
  .viewsize button:hover{ color:var(--ink); }
  .viewsize button[aria-pressed="true"]{ background:var(--hairline-2); color:var(--ink); }

  .empty{ display:grid; justify-items:center; gap:16px; padding-block:clamp(60px,10vw,120px); text-align:center; }

  @media (max-width:640px){
    .shop-top{ gap:10px; }
    .shop-search{ order:5; width:100%; }
    .shop-count{ flex:1; }
    .filter-dd{ position:static; }
    .filter-dd .fp{ left:auto; right:0; width:min(320px, calc(100vw - 40px)); }
  }
</style></head><body>

<main>
  <div class="wrap-wide shop-head stack-8">
    <p class="t-eyebrow rv">All Lighting</p>
    <h1 class="t-xl rv" data-heading>Eighty fixtures, shown lit.</h1>
  </div>

  <div class="wrap-wide">
    <div class="shop-layout">
      <nav class="shop-side" aria-label="Categories" data-side></nav>

      <div>
        <div class="shop-top">
          <span class="shop-count tnum" data-count></span>
          <input class="shop-search" type="search" placeholder="Search fixtures" data-q aria-label="Search fixtures">
          <details class="filter-dd">
            <summary>+ Filter</summary>
            <div class="fp">
              <div class="stack-8">
                <label>Price</label>
                <div class="fp-range">
                  <span class="t-xs tnum dim" data-price-lo>$0</span>
                  <input type="range" data-price-min>
                  <input type="range" data-price-max>
                  <span class="t-xs tnum dim" data-price-hi>$0</span>
                </div>
              </div>
              <div class="stack-8">
                <label>Finish</label>
                <div class="fp-finishes" data-finishes></div>
              </div>
              <button class="chip" data-clear-fp style="justify-self:start">Clear</button>
            </div>
          </details>
          <select class="shop-sort" data-sort aria-label="Sort">
            <option value="">Featured</option>
            <option value="new">What's new</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
          </select>
          <div class="viewsize" role="group" aria-label="Grid size">
            <button data-view="S" aria-label="Small grid">S</button>
            <button data-view="M" aria-label="Medium grid">M</button>
            <button data-view="L" aria-label="Large grid">L</button>
          </div>
        </div>

        <div class="grid" data-grid></div>

        <div class="empty" data-empty hidden>
          <p class="t-lg">No fixtures match.</p>
          <p class="t-sm dim">Try widening your filters or clearing the search.</p>
          <button class="btn" data-clear-all>Clear filters</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/core.js"></script>
<script>
(async () => {
  await LM.mountChrome('All Lighting');
  const D = await LM.db();
  const P = D.products, cn = D.catName;
  const url = new URL(location.href);

  const priceBounds = { lo: Math.min(...P.map(p=>p.price)), hi: Math.max(...P.map(p=>p.price)) };
  const allFinishes = [...new Set(P.flatMap(p => p.finishes.map(f => f.name)))];

  const state = {
    c: url.searchParams.get('c') || '',
    sort: url.searchParams.get('sort') || '',
    q: url.searchParams.get('q') || '',
    pMin: priceBounds.lo,
    pMax: priceBounds.hi,
    finishes: []
  };

  /* ---- sidebar ---- */
  function renderSide(){
    const side = document.querySelector('[data-side]');
    const all = `<button data-c="" aria-pressed="${state.c===''}">All Lighting <span class="n">${P.length}</span></button>`;
    const cats = D.categories.map(c => {
      const n = P.filter(p => p.category === c.slug).length;
      return `<button data-c="${c.slug}" aria-pressed="${state.c===c.slug}">${c.name} <span class="n">${n}</span></button>`;
    }).join('');
    side.innerHTML = `<span class="shop-side-title">Category</span>` + all + cats;
    side.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      state.c = b.dataset.c; apply();
    }));
  }

  /* ---- filter panel ---- */
  const minR = document.querySelector('[data-price-min]'), maxR = document.querySelector('[data-price-max]');
  [minR, maxR].forEach(r => { r.min = priceBounds.lo; r.max = priceBounds.hi; r.step = Math.max(1, Math.round((priceBounds.hi-priceBounds.lo)/100)); });
  minR.value = priceBounds.lo; maxR.value = priceBounds.hi;
  function paintPriceLabels(){
    document.querySelector('[data-price-lo]').textContent = LM.money(state.pMin);
    document.querySelector('[data-price-hi]').textContent = LM.money(state.pMax);
  }
  paintPriceLabels();
  minR.addEventListener('input', () => { state.pMin = Math.min(Number(minR.value), state.pMax); minR.value = state.pMin; paintPriceLabels(); apply(); });
  maxR.addEventListener('input', () => { state.pMax = Math.max(Number(maxR.value), state.pMin); maxR.value = state.pMax; paintPriceLabels(); apply(); });

  document.querySelector('[data-finishes]').innerHTML = allFinishes.map(f =>
    `<button class="chip" type="button" data-finish="${f}" aria-pressed="false">${f}</button>`).join('');
  document.querySelectorAll('[data-finish]').forEach(b => b.addEventListener('click', () => {
    const f = b.dataset.finish;
    if (state.finishes.includes(f)){ state.finishes = state.finishes.filter(x=>x!==f); b.setAttribute('aria-pressed','false'); }
    else { state.finishes.push(f); b.setAttribute('aria-pressed','true'); }
    apply();
  }));
  document.querySelector('[data-clear-fp]').addEventListener('click', () => {
    state.pMin = priceBounds.lo; state.pMax = priceBounds.hi; state.finishes = [];
    minR.value = priceBounds.lo; maxR.value = priceBounds.hi; paintPriceLabels();
    document.querySelectorAll('[data-finish]').forEach(b => b.setAttribute('aria-pressed','false'));
    apply();
  });

  /* ---- search / sort ---- */
  const qInput = document.querySelector('[data-q]');
  qInput.value = state.q;
  let qT;
  qInput.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { state.q = qInput.value.trim(); apply(); }, 180); });
  const sortSel = document.querySelector('[data-sort]');
  sortSel.value = state.sort;
  sortSel.addEventListener('change', () => { state.sort = sortSel.value; apply(); });

  /* ---- view size ---- */
  const COLW = { S:190, M:260, L:380 };
  const gridEl = document.querySelector('[data-grid]');
  function setView(v, persist=true){
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view===v)));
    gridEl.style.gridTemplateColumns = `repeat(auto-fill,minmax(min(100%,${COLW[v]}px),1fr))`;
    if (persist) { try { localStorage.setItem('loomina.view', v); } catch {} }
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  let savedView = 'M';
  try { savedView = localStorage.getItem('loomina.view') || 'M'; } catch {}
  setView(savedView, false);

  /* ---- render ---- */
  function updateURL(){
    const u = new URL(location.href);
    ['c','sort','q'].forEach(k => u.searchParams.delete(k));
    if (state.c) u.searchParams.set('c', state.c);
    if (state.sort) u.searchParams.set('sort', state.sort);
    if (state.q) u.searchParams.set('q', state.q);
    history.replaceState(null, '', u.pathname + u.search);
  }

  function apply(){
    let items = P.slice();
    if (state.c) items = items.filter(p => p.category === state.c);
    if (state.q){
      const q = state.q.toLowerCase();
      items = items.filter(p => (p.name+p.tagline+cn[p.category]).toLowerCase().includes(q));
    }
    if (state.finishes.length) items = items.filter(p => p.finishes.some(f => state.finishes.includes(f.name)));
    items = items.filter(p => p.price >= state.pMin && p.price <= state.pMax);
    if (state.sort === 'price-asc') items.sort((a,b)=>a.price-b.price);
    else if (state.sort === 'price-desc') items.sort((a,b)=>b.price-a.price);
    else if (state.sort === 'new') items.reverse();

    document.querySelector('[data-count]').textContent = `${items.length} fixture${items.length===1?'':'s'}`;
    document.querySelector('[data-heading]').textContent = state.c ? cn[state.c] : 'Eighty fixtures, shown lit.';
    renderSide();

    const empty = document.querySelector('[data-empty]');
    if (!items.length){
      gridEl.innerHTML = ''; empty.hidden = false;
    } else {
      empty.hidden = true;
      gridEl.innerHTML = items.map(p => LM.card(p, cn[p.category])).join('');
    }
    LM.reveals();
    updateURL();
  }

  document.querySelector('[data-clear-all]').addEventListener('click', () => {
    state.c=''; state.q=''; state.sort=''; state.finishes=[]; state.pMin=priceBounds.lo; state.pMax=priceBounds.hi;
    qInput.value=''; sortSel.value=''; minR.value=priceBounds.lo; maxR.value=priceBounds.hi; paintPriceLabels();
    document.querySelectorAll('[data-finish]').forEach(b => b.setAttribute('aria-pressed','false'));
    apply();
  });

  apply();
})();
</script></body></html>
